[tox]
# Keep tests on the same interpreter as the production image. The Nix
# development shell and infrastructure CI pin this version as well.
env_list = py312
# The API is an application, not a package: there is nothing to build or
# install, only requirements to put in front of pytest.
skipsdist = true

[testenv]
skip_install = true
deps = -r requirements-dev.txt
commands = pytest {posargs}
# tox 4 starts every environment from an empty environment. The CI image points
# pip at a local wheelhouse through these variables and has no route to
# pypi.org, so without passing them through, dependency installation is the
# first thing that fails there.
passenv =
    PIP_NO_INDEX
    PIP_FIND_LINKS
    PIP_DISABLE_PIP_VERSION_CHECK

# Coverage variant: kept out of the default env because the offline CI
# wheelhouse does not carry pytest-cov/coverage wheels yet. Run locally or in
# nightly with `tox -e py312-cov`; promote into env_list once the wheelhouse
# blob has been rebuilt with the extra wheels.
[testenv:py312-cov]
skip_install = true
deps =
    -r requirements-dev.txt
    pytest-cov>=5.0.0
commands = pytest --cov=. --cov-report=term-missing {posargs}
passenv =
    PIP_NO_INDEX
    PIP_FIND_LINKS
    PIP_DISABLE_PIP_VERSION_CHECK
