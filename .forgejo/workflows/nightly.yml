name: Nightly

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deep-verification:
    name: Fuzz, soak, sanitizers, coverage
    runs-on: driscord-builder
    timeout-minutes: 180
    env:
      FORGEJO_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact event commit
        run: forgejo-checkout

      - name: Build fuzz targets
        run: cmake --workflow --preset server-fuzz

      - name: Fuzz RTP slot rewriter
        run: >-
          .builds/server-fuzz/core/tests/fuzz/fuzz_rtp_slot_rewriter
          -max_total_time=300 -max_len=1400
          core/tests/fuzz/corpora/rtp

      - name: Fuzz SFU SDP
        run: >-
          .builds/server-fuzz/core/tests/fuzz/fuzz_sfu_sdp
          -max_total_time=300 -max_len=1400
          -dict=core/tests/fuzz/dictionaries/sdp.tokens
          core/tests/fuzz/corpora/sdp

      - name: Fuzz signaling protocol
        run: >-
          .builds/server-fuzz/core/tests/fuzz/fuzz_protocol
          -max_total_time=300 -max_len=1400
          core/tests/fuzz/corpora/signaling

      - name: Core tests under ASan/UBSan
        run: cmake --workflow --preset core-tests-asan

      - name: Soak and capacity tests
        run: |
          cmake --workflow --preset core-tests
          ctest --test-dir .builds/core-tests -L soak --output-on-failure             --no-tests=ignore

      - name: C++ coverage report
        run: |
          cmake --workflow --preset coverage
          ./scripts/coverage_report.sh

      - name: Python coverage report
        working-directory: backend/api
        run: tox -e py312-cov

      - name: Show coverage summary
        if: always()
        run: |
          echo "=== C++ coverage ==="
          cat .builds/coverage/coverage/summary.txt || echo "(no C++ summary)"
