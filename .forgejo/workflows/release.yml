# Release pipeline signal. Copy verbatim into <repo>/.forgejo/workflows/release.yml
# and set CI_RELEASE_CELL to the promoter cell of the target namespace.
#
# Publishing a Forgejo Release (stable, not draft, tag vX.Y.Z) runs this job:
#   1. candidates/ensure — the build cell makes sure every service has an image
#      built from exactly this commit (only services whose sources changed are
#      rebuilt); the call is idempotent and is simply repeated until ready;
#   2. releases/<cell>/promote — the namespace's promoter rolls the images out
#      by digest and leaves unchanged services untouched.
# Both calls carry a fresh OIDC token (accepted only by the named cell) and the
# job's own short-lived token for repository reads. Nothing is checked out and
# no command from the repository runs here; build and deployment policy live
# in /homelab. Re-running the Actions run of an older release promotes that
# release again — this is the rollback path.
name: Release

on:
  release:
    types: [published]

enable-openid-connect: true

concurrency:
  group: release-${{ forgejo.repository }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CI_RELEASE_CELL: driscord
  CI_GATE: https://git.homelab.ceooptimizator.tech/_ci/v1

jobs:
  release:
    name: Ensure candidate and promote
    runs-on: linux-bookworm
    timeout-minutes: 150
    env:
      RELEASE_ID: ${{ forgejo.event.release.id }}
      REPOSITORY_TOKEN: ${{ forgejo.token }}
    steps:
      - name: Ensure candidate images
        run: |
          set -eu
          case "$RELEASE_ID" in
            ''|*[!0-9]*) echo 'Forgejo supplied an invalid release id' >&2; exit 1 ;;
          esac
          mint() {
            curl -fsS --connect-timeout 10 --max-time 30 \
              -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$1" \
              | jq -er '.value | select(test("^[^.]+\\.[^.]+\\.[^.]+$"))'
          }
          attempt=0
          while :; do
            attempt=$((attempt + 1))
            code="$(curl -sS --connect-timeout 10 --max-time 120 -o candidate.json -w '%{http_code}' \
              -H "Authorization: Bearer $(mint ci-candidate-builder)" \
              -H "X-Forgejo-Token: $REPOSITORY_TOKEN" \
              -H 'Content-Type: application/json' \
              --data "{\"release_id\":$RELEASE_ID}" \
              "$CI_GATE/candidates/ensure")"
            case "$code" in
              200) echo "candidate ready:"; jq . candidate.json; break ;;
              202) echo "attempt $attempt: building $(jq -c '.pending' candidate.json)"; sleep 30 ;;
              *)   echo "candidates/ensure returned HTTP $code" >&2; jq . candidate.json >&2 || cat candidate.json >&2; exit 1 ;;
            esac
            if [ "$attempt" -ge 240 ]; then
              echo 'candidate was not ready in time' >&2; exit 1
            fi
          done

      - name: Promote the release
        run: |
          set -eu
          mint() {
            curl -fsS --connect-timeout 10 --max-time 30 \
              -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$1" \
              | jq -er '.value | select(test("^[^.]+\\.[^.]+\\.[^.]+$"))'
          }
          jq -c --argjson id "$RELEASE_ID" '{release_id: $id, candidate: .}' candidate.json > promote.json
          code="$(curl -sS --connect-timeout 10 --max-time 600 -o result.json -w '%{http_code}' \
            -H "Authorization: Bearer $(mint "${CI_RELEASE_CELL}-production")" \
            -H "X-Forgejo-Token: $REPOSITORY_TOKEN" \
            -H 'Content-Type: application/json' \
            --data @promote.json \
            "$CI_GATE/releases/${CI_RELEASE_CELL}/promote")"
          jq . result.json || cat result.json
          [ "$code" = 200 ] || { echo "releases/${CI_RELEASE_CELL}/promote returned HTTP $code" >&2; exit 1; }
