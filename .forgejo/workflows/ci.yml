name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-gate:
    name: Build and test
    runs-on: driscord-builder
    timeout-minutes: 45
    env:
      FORGEJO_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact event commit
        run: forgejo-checkout

      # One command per configuration: configure, build and test all come from
      # CMakePresets.json, so this file stays orchestration only.
      - name: Formatting
        run: ./scripts/format.sh --check

      - name: Signaling and SFU tests
        run: cmake --workflow --preset server-tests

      - name: Core tests (real Google WebRTC)
        run: cmake --workflow --preset core-tests

      - name: Qt client and its tests
        run: cmake --workflow --preset client-tests

      - name: API tests
        working-directory: backend/api
        run: tox
