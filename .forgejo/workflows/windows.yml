name: Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cross-build:
    name: Cross-build and package
    runs-on: driscord-win-builder
    timeout-minutes: 60
    env:
      FORGEJO_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact event commit
        run: forgejo-checkout

      - name: Cross-built tests under Wine
        run: cmake --workflow --preset windows-tests

      - name: Windows client package
        run: cmake --workflow --preset windows-release
