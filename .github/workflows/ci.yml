name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BOOST_VERSION: '1.89.0'

jobs:
  google-webrtc:
    name: Prepare pinned Google WebRTC
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            clang lld cmake git python3 ca-certificates curl

      - name: Restore pinned WebRTC artifact
        id: cache-webrtc
        uses: actions/cache@v4
        with:
          path: |
            .cache/google-webrtc-sdk
          key: google-webrtc-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('third_party/google_webrtc_revision.txt', 'third_party/depot_tools_revision.txt', 'third_party/patches/*.patch', 'scripts/build_google_webrtc.sh') }}

      # A standard hosted Linux runner exposes only 14 GB of workspace storage,
      # while a first WebRTC sync temporarily needs substantially more. These
      # are preinstalled SDKs on an ephemeral GitHub VM, not workspace data.
      - name: Reclaim hosted-runner disk for first WebRTC build
        if: steps.cache-webrtc.outputs.cache-hit != 'true' && runner.environment == 'github-hosted'
        run: |
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/local/.ghcup \
            /usr/share/dotnet

      - name: Verify disk capacity for first WebRTC build
        if: steps.cache-webrtc.outputs.cache-hit != 'true'
        run: |
          available_kb="$(df --output=avail -k "$GITHUB_WORKSPACE" | tail -n 1)"
          required_kb=$((35 * 1024 * 1024))
          if (( available_kb < required_kb )); then
            echo "WebRTC cache miss requires at least 35 GiB free; configure RUNNER_LABEL with a larger runner." >&2
            exit 1
          fi

      - name: Build pinned WebRTC artifact
        if: steps.cache-webrtc.outputs.cache-hit != 'true'
        run: ./scripts/build_google_webrtc.sh

      - name: Verify cached artifact
        run: |
          test -f .cache/google-webrtc-sdk/src/api/peer_connection_interface.h
          test -f .cache/google-webrtc-sdk/src/out/driscord-release/obj/libwebrtc.a

  tests:
    name: Tests (Linux)
    needs: google-webrtc
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            clang lld cmake ninja-build wget \
            libgnutls28-dev libnss3-dev libpulse-dev \
            libx11-dev libxcomposite-dev libxdamage-dev libxext-dev \
            libxfixes-dev libxrandr-dev libxtst-dev

      - name: Restore pinned WebRTC artifact
        uses: actions/cache/restore@v4
        with:
          path: |
            .cache/google-webrtc-sdk
          key: google-webrtc-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('third_party/google_webrtc_revision.txt', 'third_party/depot_tools_revision.txt', 'third_party/patches/*.patch', 'scripts/build_google_webrtc.sh') }}
          fail-on-cache-miss: true

      - name: Cache Boost headers
        id: cache-boost
        uses: actions/cache@v4
        with:
          path: ~/boost-cache
          key: boost-${{ env.BOOST_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Download Boost headers
        if: steps.cache-boost.outputs.cache-hit != 'true'
        run: |
          BOOST_VER_UNDER="${BOOST_VERSION//./_}"
          wget -q "https://archives.boost.io/release/${BOOST_VERSION}/source/boost_${BOOST_VER_UNDER}.tar.gz"
          mkdir -p ~/boost-cache/include
          tar xzf "boost_${BOOST_VER_UNDER}.tar.gz" \
            --strip-components=1 \
            -C ~/boost-cache/include \
            "boost_${BOOST_VER_UNDER}/boost"

      - name: Set BOOST_ROOT
        run: echo "BOOST_ROOT=$HOME/boost-cache" >> "$GITHUB_ENV"

      - name: Cache CMake dependencies
        uses: actions/cache@v4
        with:
          path: .builds/cmake/google-webrtc-test-release/_deps
          key: cmake-test-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/CMakeLists.txt') }}
          restore-keys: cmake-test-${{ runner.os }}-${{ runner.arch }}-

      - name: Check formatting
        run: ./scripts/format.sh --check

      - name: Build and run tests
        run: ./scripts/build.sh --test

  build-server:
    name: Build signaling server (OpenSSL)
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            clang cmake ninja-build libssl-dev wget

      - name: Cache Boost headers
        id: cache-boost
        uses: actions/cache@v4
        with:
          path: ~/boost-cache
          key: boost-${{ env.BOOST_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Download Boost headers
        if: steps.cache-boost.outputs.cache-hit != 'true'
        run: |
          BOOST_VER_UNDER="${BOOST_VERSION//./_}"
          wget -q "https://archives.boost.io/release/${BOOST_VERSION}/source/boost_${BOOST_VER_UNDER}.tar.gz"
          mkdir -p ~/boost-cache/include
          tar xzf "boost_${BOOST_VER_UNDER}.tar.gz" \
            --strip-components=1 \
            -C ~/boost-cache/include \
            "boost_${BOOST_VER_UNDER}/boost"

      - name: Set BOOST_ROOT
        run: echo "BOOST_ROOT=$HOME/boost-cache" >> "$GITHUB_ENV"

      - name: Build signaling server
        run: ./scripts/build.sh --server

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: driscord-server-linux
          path: .builds/server/release/driscord_server

  build-client:
    name: Build Qt client (Linux)
    needs: google-webrtc
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            clang lld cmake ninja-build wget \
            libgnutls28-dev libnss3-dev libpulse-dev \
            libx11-dev libxcomposite-dev libxdamage-dev libxext-dev \
            libxfixes-dev libxrandr-dev libxtst-dev \
            libxinerama-dev libxcursor-dev libxi-dev \
            libwayland-dev libxkbcommon-dev \
            libgl1-mesa-dev libegl1-mesa-dev

      - name: Install Qt 6.7
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'
          cache: true

      - name: Restore pinned WebRTC artifact
        uses: actions/cache/restore@v4
        with:
          path: |
            .cache/google-webrtc-sdk
          key: google-webrtc-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('third_party/google_webrtc_revision.txt', 'third_party/depot_tools_revision.txt', 'third_party/patches/*.patch', 'scripts/build_google_webrtc.sh') }}
          fail-on-cache-miss: true

      - name: Cache Boost headers
        id: cache-boost
        uses: actions/cache@v4
        with:
          path: ~/boost-cache
          key: boost-${{ env.BOOST_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Download Boost headers
        if: steps.cache-boost.outputs.cache-hit != 'true'
        run: |
          BOOST_VER_UNDER="${BOOST_VERSION//./_}"
          wget -q "https://archives.boost.io/release/${BOOST_VERSION}/source/boost_${BOOST_VER_UNDER}.tar.gz"
          mkdir -p ~/boost-cache/include
          tar xzf "boost_${BOOST_VER_UNDER}.tar.gz" \
            --strip-components=1 \
            -C ~/boost-cache/include \
            "boost_${BOOST_VER_UNDER}/boost"

      - name: Set BOOST_ROOT
        run: echo "BOOST_ROOT=$HOME/boost-cache" >> "$GITHUB_ENV"

      - name: Cache CMake dependencies
        uses: actions/cache@v4
        with:
          path: .builds/cmake/qt-webrtc-release/_deps
          key: cmake-qt-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/CMakeLists.txt') }}
          restore-keys: cmake-qt-${{ runner.os }}-${{ runner.arch }}-

      - name: Build Qt client
        run: ./scripts/build.sh --qt

      - name: Upload runnable client directory
        uses: actions/upload-artifact@v4
        with:
          name: driscord-client-linux
          path: |
            .builds/cmake/qt-webrtc-release/client-qt/driscord_client
            .builds/cmake/qt-webrtc-release/client-qt/libdatachannel.so*

  build-api:
    name: Build API
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/api/requirements.txt

      - name: Install API dependencies
        run: ./scripts/build.sh --api
